# Experiment für eine einzelne GPU. Ein Schritt prüft den Trainingspfad.
base_model: /models/GLM-5.3-Flash-BF16
adapter: qlora
load_in_4bit: true
quantize_moe_experts: true
bf16: true
attn_implementation: sdpa
activation_checkpointing: true

datasets:
  - path: /data/train.jsonl
    type: chat_template
    roles_to_train: ["assistant"]
chat_template: tokenizer_default
train_on_inputs: false
val_set_size: 0
dataset_prepared_path: /out/prepared
output_dir: /out/adapter

# Ausgabeprojektionen im Textdecoder des glm5_next-Checkpoints.
lora_target_modules: '.*language_model\.layers\.[0-9]+\.self_attn\.o_proj'
lora_r: 8
lora_alpha: 16
lora_dropout: 0
sequence_len: 512
sample_packing: false
micro_batch_size: 1
gradient_accumulation_steps: 1
optimizer: adamw_torch
learning_rate: 0.0001
lr_scheduler: constant
warmup_steps: 0
max_steps: 1
save_steps: 1
logging_steps: 1
seed: 17
